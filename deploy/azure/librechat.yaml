version: 1.3.17
cache: true

interface:
  modelSelect: false
  parameters: false
  presets: false
  fileSearch: true
  fileCitations: true
  runCode: true
  contextUsage: true
  contextCost: false
  marketplace:
    use: true
  agents:
    use: true
    create: true
    share: true
    public: false
  prompts:
    use: true
    create: true
    share: true
    public: false
  skills:
    use: true
    create: true
    share: true
    public: false
  mcpServers:
    use: true
    create: true
    share: true
    public: false
  remoteAgents:
    use: true
    create: true
    share: false
    public: false
  schedules:
    use: true
    create: true
    maxPerUser: 10
    minIntervalMinutes: 60
    autoDisableAfterFailures: 5
  defaultPinnedTools:
    - artifacts
    - execute_code
    - web_search
    - file_search

webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none

memory:
  disabled: false
  personalize: true
  agent:
    enabled: true
    provider: 'OpenRouter'
    model: 'qwen/qwen3.8-27b'

speech:
  speechTab:
    speechToText:
      engineSTT: 'browser'
    textToSpeech:
      engineTTS: 'browser'

fileConfig:
  endpoints:
    OpenRouter:
      legacyFileUploadUX: false
      defaultLLMDeliveryPath:
        overrides:
          application/pdf: text

endpoints:
  agents:
    disableBuilder: false
    recursionLimit: 25
    maxRecursionLimit: 50
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - ocr
      - run_in_background
      - tool_intents
      - programmatic_tools
    maxToolCallArgBytesByTool:
      create_file: 524288
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'qwen/qwen3.8-27b'
        fetch: true
      titleConvo: true
      titleModel: 'qwen/qwen3.8-27b'
      dropParams:
        - 'stop'
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: qwen-documents
      label: Qwen
      default: true
      description: Chat with Qwen and create downloadable Office files
      executeCode: true
      fileSearch: true
      webSearch: true
      memory: true
      preset:
        endpoint: OpenRouter
        endpointType: custom
        model: qwen/qwen3.8-27b
        modelLabel: Qwen
        promptPrefix: |
          You can create real downloadable files. python-docx, openpyxl, and python-pptx are already installed. When the user asks for a DOCX, XLSX, PPTX, PDF, CSV, or image, call bash_tool before you answer. Write the finished file under /mnt/data, for example /mnt/data/document.docx. The application attaches that file to your reply. Never paste a generator script, pip command, or markdown substitute.
